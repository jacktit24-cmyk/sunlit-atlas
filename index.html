      var pts = window.TRIP.elevation, w = 460, h = 150, max = 3600;
      var step = w / (pts.length - 1);
      var line = pts.map(function (p, i) { return (i ? "L" : "M") + (i * step).toFixed(0) + " " + (h - 18 - (p.m / max) * (h - 42)).toFixed(0); }).join("");
      return '<svg class="elev-svg" viewBox="0 0 ' + w + " " + h + '">' +
        '<path d="' + line + " L" + w + " " + (h - 6) + " L0 " + (h - 6) + 'Z" fill="rgba(196,85,58,.14)" stroke="none"/>' +
        '<path d="' + line + '" fill="none" stroke="var(--terra)" stroke-width="2"/>' +
        pts.map(function (p, i) {
          var x = i * step, y = h - 18 - (p.m / max) * (h - 42);
          return '<circle cx="' + x + '" cy="' + y + '" r="3" fill="var(--gold)"/>' +
            '<text x="' + x + '" y="' + (y - 8) + '" text-anchor="' + (i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle") + '" style="font-family:var(--mono);font-size:8.6px;fill:var(--paper-dim)">' + p.m.toLocaleString() + "</text>" +
            '<text x="' + x + '" y="' + (h - 6) + '" text-anchor="' + (i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle") + '" style="font-family:var(--disp);font-size:7.6px;letter-spacing:.08em;fill:var(--faint)">' + U.esc(p.name.toUpperCase()) + "</text>";
        }).join("") +
        "</svg>";
    }

    function tickClocks() {
      var n = T.now();
      document.querySelectorAll("[data-clock]").forEach(function (el) {
        el.textContent = T.fmtTime(n, el.getAttribute("data-clock"));
      });
      document.querySelectorAll("[data-clockd]").forEach(function (el) {
        el.textContent = T.fmtDay(n, el.getAttribute("data-clockd"));
      });
    }

    render();
    tickClocks();
    App.onTick(tickClocks);
  };
})();

/* ============================================================
   PREPARE.JS — readiness dashboard, task system, ordering
   windows, packing board. Checkbox state persists locally.
   ============================================================ */
window.Views = window.Views || {};

window.Views.prepare = function (root) {
  "use strict";
  var I = U.icons;

  function render() {
    var rd = Engine.readiness();
    var tasks = Engine.tasksWithState();
    var ord = Engine.orderingStatus();
    var cats = window.TRIP.taskCategories;
    var todayBkk = T.todayYmd("Asia/Bangkok");

    var STATE_ORDER = { "overdue": 0, "due-today": 1, "due-soon": 2, "open": 3, "not-open": 4, "done": 5 };

    function taskRow(t) {
      var pillTone = t.state === "overdue" ? "danger" : t.state === "due-today" ? "danger" : t.state === "due-soon" ? "warn" : t.state === "not-open" ? "dim" : "info";
      var pillText = t.state === "overdue" ? "overdue" : t.state === "due-today" ? "due today" :
        t.state === "due-soon" ? "due in " + t.daysLeft + " d" : t.state === "not-open" ? "opens " + T.fmtYmd(t.openFrom) : t.state === "done" ? "done" : "open";
      return '<div class="task ' + t.state + '">' +
        '<input type="checkbox" class="cb" id="cb-' + t.id + '" data-task="' + t.id + '"' + (t.state === "done" ? " checked" : "") + " aria-label=\"" + U.esc(t.title) + "\">" +
        '<div style="flex:1"><label class="t" for="cb-' + t.id + '">' + (t.priority === "critical" ? '<span style="color:var(--danger);font-family:var(--disp);font-size:.56rem;letter-spacing:.2em;border:1px solid rgba(228,96,78,.5);border-radius:4px;padding:1px 6px;margin-right:8px;vertical-align:2px">CRITICAL</span>' : "") + U.esc(t.title) + "</label>" +
        '<div class="d">' + U.esc(t.detail) + "</div></div>" +
        '<div class="due">' + (t.state !== "done" ? '<span class="pill ' + pillTone + '">' + pillText + "</span>" : '<span class="pill ok">done</span>') +
        (t.due ? '<div class="dt">' + T.fmtYmd(t.due, { weekday: "short", day: "numeric", month: "short" }) + "</div>" : "") + "</div></div>";
    }

    /* surface board: what deserves attention right now */
    var surfaced = tasks.filter(function (t) { return t.state === "overdue" || t.state === "due-today" || t.state === "due-soon"; })
      .sort(function (a, b) { return STATE_ORDER[a.state] - STATE_ORDER[b.state] || (a.daysLeft || 0) - (b.daysLeft || 0); });

    root.innerHTML =
      '<div class="view"><section class="section">' +

      '<div class="section-head"><h2>Preparation command</h2><div class="rule"></div>' +
      '<span style="color:var(--faint);font-size:.78rem">' + T.fmtYmd(todayBkk, { weekday: "long", day: "numeric", month: "long" }) + " · Bangkok reckoning</span></div>" +

      /* readiness band */
      '<div class="card pad readiness-band">' +
        '<div class="ringwrap">' + ring(rd.overall) +
          '<div><div style="font-family:var(--disp);font-size:1.1rem">' + (rd.onSchedule ? "On schedule" : "Attention needed") + "</div>" +
          '<div style="color:var(--faint);font-size:.8rem;margin-top:4px">' + rd.overdue + " overdue · " + rd.overdueCritical + " critical</div></div>" +
        "</div>" +
        '<div class="cat-bars">' + cats.map(function (c) {
          var s = rd.perCat[c.id];
          return '<div class="cat-bar' + (s.pct === 100 ? " full" : "") + '"><span class="nm">' + U.esc(c.name) + '</span><div class="bar"><div class="fill" style="width:' + s.pct + '%"></div></div><span class="n">' + s.done + "/" + s.total + "</span></div>";
        }).join("") + "</div>" +
      "</div>" +
      '<p class="coords" style="margin:10px 2px 0">READINESS FORMULA · category = done ÷ currently-applicable items · overall = weighted mean (documents ×3, flights ×3, hotels/transport/packing/work/money/health ×2, others ×1) · “on schedule” = zero overdue critical and at most two overdue overall</p>' +

      /* now board */
      '<div class="section-head" style="margin-top:34px"><h2>Surfaced now</h2><div class="rule"></div>' +
      '<span style="color:var(--faint);font-size:.78rem">what the calendar says to touch this week</span></div>' +
      '<div class="card">' + (surfaced.length ? surfaced.map(taskRow).join("") :
        '<div class="empty">' + I.check + "<p>Nothing due or overdue right now. The next window opens on its own.</p></div>") + "</div>" +

      /* ordering windows */
      '<div class="section-head" style="margin-top:34px"><h2>Ordering windows</h2><div class="rule"></div>' +
      '<span style="color:var(--faint);font-size:.78rem">all dates are planning estimates, not carrier promises</span></div>' +
      '<div class="card pad">' +
        '<div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap"><span class="pill ' + ord.tone + '">' + U.esc(ord.label) + '</span><span style="color:var(--paper-dim);font-size:.86rem">' + U.esc(ord.detail) + "</span></div>" +
        '<div class="orderflow">' + window.TRIP.orderingWindows.map(function (w) {
          var cls = w.id === ord.id ? "current" : (todayBkk > w.until ? "past" : "");
          return '<div class="ostage ' + cls + '"><div class="until">until ' + T.fmtYmd(w.until) + '</div><div class="lb">' + U.esc(w.label) + "</div>" + U.esc(w.detail) + "</div>";
        }).join("") + "</div>" +
        '<div class="notebox" style="margin-top:16px">' + I.bag + " <b>" + U.esc(window.TRIP.usOrderingWindow.label) + ":</b> " + U.esc(window.TRIP.usOrderingWindow.detail) + "</div>" +
      "</div>" +

      /* full task system by category */
      '<div class="section-head" style="margin-top:34px"><h2>Every task, by category</h2><div class="rule"></div></div>' +
      cats.map(function (c) {
        var mine = tasks.filter(function (t) { return t.cat === c.id; })
          .sort(function (a, b) { return STATE_ORDER[a.state] - STATE_ORDER[b.state] || String(a.due || "9999").localeCompare(String(b.due || "9999")); });
        var open = mine.filter(function (t) { return t.state !== "done"; }).length;
        var warn = mine.some(function (t) { return t.state === "overdue" || t.state === "due-today"; });
        return '<details class="card taskgroup"' + (warn ? " open" : "") + '><summary>' +
          '<span class="nm" style="color:' + (warn ? "var(--danger)" : "var(--paper)") + '">' + U.esc(c.name) + "</span>" +
          (warn ? '<span class="pill danger">action</span>' : "") +
          '<span class="cnt">' + (mine.length - open) + "/" + mine.length + " done</span></summary>" +
          mine.map(taskRow).join("") + "</details>";
      }).join("") +

      /* packing board */
      '<div class="section-head" style="margin-top:34px"><h2>Packing board</h2><div class="rule"></div>' +
      '<span style="color:var(--faint);font-size:.78rem">• = trip-critical · lanes match the Qatar baggage rules</span></div>' +
      '<div class="packboard">' + window.TRIP.packingLanes.bags.map(function (bag) {
        var items = window.TRIP.packing.filter(function (p) { return p.bag === bag.id; });
        return '<div class="card packcol"><div class="colhead"><div class="nm">' + U.esc(bag.name) + '</div><div class="note">' + U.esc(bag.note) + "</div></div>" +
          items.map(function (p) {
            var done = Store.isChecked("packing", p.id);
            var whenName = (window.TRIP.packingLanes.when.find(function (w) { return w.id === p.when; }) || {}).name || "";
            return '<div class="packitem' + (done ? " done" : "") + (p.critical ? " crit" : "") + '">' +
              '<input type="checkbox" class="cb" id="pk-' + p.id + '" data-pack="' + p.id + '"' + (done ? " checked" : "") + ' aria-label="' + U.esc(p.label) + '">' +
              '<label for="pk-' + p.id + '">' + U.esc(p.label) + "</label>" +
              '<span class="when-tag">' + U.esc(whenName) + "</span></div>";
          }).join("") + "</div>";
      }).join("") + "</div>" +

      /* progress export */
      '<div class="card pad" style="margin-top:26px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">' +
        '<span class="kicker dim" style="margin-right:auto">progress lives only on this machine</span>' +
        '<button class="btn small" id="exp-btn">' + I.export + " Export progress</button>" +
        '<label class="btn small" style="cursor:pointer">' + I.import_ + ' Restore progress<input type="file" id="imp-file" accept=".json" style="display:none"></label>' +
        '<button class="btn small ghost" id="reset-btn">Reset all ticks</button>' +
      "</div>" +

      "</section></div>";

    /* wire checkboxes */
    root.querySelectorAll("[data-task]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        Store.setChecked("tasks", cb.getAttribute("data-task"), cb.checked);
        render();
      });
    });
    root.querySelectorAll("[data-pack]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        Store.setChecked("packing", cb.getAttribute("data-pack"), cb.checked);
        render();
      });
    });

    var exp = document.getElementById("exp-btn");
    if (exp) exp.addEventListener("click", function () {
      var blob = new Blob([Store.exportAll()], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "sunlit2026-progress-" + T.todayYmd("Asia/Bangkok") + ".json";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      App.toast("Progress exported");
    });
    var impf = document.getElementById("imp-file");
    if (impf) impf.addEventListener("change", function () {
      var f = impf.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try { Store.importAll(String(r.result)); App.toast("Progress restored"); render(); }
        catch (e) { App.toast("That file is not a progress export"); }
      };
      r.readAsText(f);
    });
    var rst = document.getElementById("reset-btn");
    if (rst) rst.addEventListener("click", function () {
      if (confirm("Clear every checked task and packing item on this machine?")) { Store.resetAll(); render(); }
    });
  }

  function ring(pct) {
    var r = 56, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
    return '<div class="ring"><svg width="132" height="132" viewBox="0 0 132 132">' +
      '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="var(--ink3)" stroke-width="10"/>' +
      '<circle cx="66" cy="66" r="' + r + '" fill="none" stroke="url(#rg2)" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + c + '" stroke-dashoffset="' + off + '"/>' +
      '<defs><linearGradient id="rg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--gold-deep)"/><stop offset="1" stop-color="var(--gold)"/></linearGradient></defs>' +
      '</svg><div class="num">' + pct + "%<small>ready</small></div></div>";
  }

  render();
};

      "<h3>" + U.esc(h.name) + "</h3>" +
      '<div class="big-list">' +
        '<div class="row"><div class="k">dates</div><div class="v">' + T.fmtYmd(h.checkIn) + " → " + T.fmtYmd(h.checkOut) + " · " + h.nights + " night" + (h.nights > 1 ? "s" : "") + "</div></div>" +

        (h.phone ? '<div class="row"><div class="k">phone</div><div class="v mono">' + U.esc(h.phone) + "</div></div>" : "") +
        (h.room ? '<div class="row"><div class="k">room</div><div class="v">' + U.esc(h.room) + "</div></div>" : "") +

  function conflictCard(c) {

      '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><span class="cid">' + c.id + "</span>" +

      '<div class="what"><b style="color:var(--paper-dim)">Conflict:</b> ' + U.esc(c.conflict) + "</div>" +

      '<div class="what" style="margin-top:8px"><b style="color:var(--paper-dim)">Why:</b> ' + U.esc(c.why) + "</div>" +
      (c.action ? '<div class="notebox warn" style="margin-top:10px">' + I.warn + " <b>Action:</b> " + U.esc(c.action) + "</div>" : "") +
    "</article>";

  var docs = window.TRIP.documents;
  var open = window.TRIP.conflicts.filter(function (c) { return c.state === "open"; });
  var rest = window.TRIP.conflicts.filter(function (c) { return c.state !== "open"; });

  root.innerHTML =
    '<div class="view"><section class="section">' +
    '<div class="section-head"><h2>Document library</h2><div class="rule"></div>' +
    '<button class="btn small" id="reveal-toggle">' + (reveal ? I.eyeOff + " Hide sensitive values" : I.eye + " Reveal sensitive values") + "</button></div>" +

    '<div class="notebox" style="margin-bottom:18px">' + I.doc +
      " 13 files in the read-only source folder, classified by CONTENT (two 'Latam' files are actually American Airlines bookings). Booking references and confirmation numbers are masked until revealed. The originals and their extraction copies stay on Jack's PC; every document's key facts are summarized below." +
    "</div>" +

    '<div class="grid g2">' + docs.map(docCard).join("") + "</div>" +

    '<div class="section-head" style="margin-top:40px"><h2>Every night, accounted for</h2><div class="rule"></div>' +
    '<span style="color:var(--faint);font-size:.78rem">the five sleeping arrangements + parents’ reference stays</span></div>' +
    '<div class="grid g2">' + window.TRIP.hotels.map(hotelCard).join("") + "</div>" +
    '<div class="card pad" style="margin-top:18px"><div class="kicker dim">parents’ stays after the split · reference</div>' +
      '<div class="big-list">' + window.TRIP.parentsHotels.map(function (h) {
        return '<div class="row"><div class="k">' + T.fmtYmd(h.date) + "–" + T.fmtYmd(h.to) + '</div><div class="v">' + U.esc(h.name) + ' <span style="color:var(--faint)">· ' + U.esc(h.note) + "</span></div></div>";
      }).join("") + "</div></div>" +

    '<div class="section-head" style="margin-top:40px"><h2>Conflict register</h2><div class="rule"></div>' +
    '<span style="color:var(--faint);font-size:.78rem">every judgment call, with its evidence · mirrors ITINERARY_CONFLICTS.md</span></div>' +
    (open.length ? '<div class="grid" style="gap:16px;margin-bottom:16px">' + open.map(conflictCard).join("") + "</div>" : "") +
    '<details class="card taskgroup"><summary><span class="nm">Resolved + noted (' + rest.length + ')</span><span class="cnt">expand</span></summary>' +
      '<div class="grid" style="gap:16px;padding:0 16px 16px">' + rest.map(conflictCard).join("") + "</div></details>" +

    '<div class="section-head" style="margin-top:40px"><h2>Emergency card</h2><div class="rule"></div></div>' +
    '<div class="card pad" id="emc-section">' +
      '<p style="color:var(--paper-dim);font-size:.9rem;margin-top:0">One page, offline, printable. Booking references print in full: keep paper copies with the passport, not lying around.</p>' +
      '<button class="btn primary" id="print-emergency">' + I.print + " Print emergency card</button>" +
      '<div class="print-only" id="emergency-card">' + emergencyCardHtml() + "</div>" +
    "</div>" +

    "</section></div>";

  function emergencyCardHtml() {
    return '<div style="font-family:Georgia,serif;color:#111;padding:10px 0">' +
      "<h1 style='font-size:16pt;margin:0 0 2pt'>PERU + USA 2026 · EMERGENCY CARD · Toby Jack Tait</h1>" +
      "<p style='margin:0 0 8pt;font-size:9pt'>28 Sep – 31 Oct 2026 · BKK · DOH · MIA · JAX · LIM · CUZ · printed from the local dashboard</p>" +
      "<h2 style='font-size:11pt;margin:8pt 0 3pt'>FLIGHTS</h2>" +
      "<table style='width:100%;border-collapse:collapse;font-size:9pt'>" +
      Engine.activeFlights().map(function (f) {
        var pf = Engine.placeOf(f.from), pt2 = Engine.placeOf(f.to);
        return "<tr><td style='border:1px solid #999;padding:3pt'>" + f.flightNo + "</td><td style='border:1px solid #999;padding:3pt'>" + f.from + "→" + f.to + "</td>" +
          "<td style='border:1px solid #999;padding:3pt'>" + T.fmtDay(T.parse(f.dep), pf.tz) + " " + T.fmtTime(T.parse(f.dep), pf.tz) + " → " + T.fmtTime(T.parse(f.arr), pt2.tz) + "</td>" +
          "<td style='border:1px solid #999;padding:3pt'>" + (f.bookingRef || "") + (f.seat ? " · " + f.seat : "") + "</td></tr>";
      }).join("") + "</table>" +
      "<h2 style='font-size:11pt;margin:8pt 0 3pt'>SLEEPS</h2>" +
      "<table style='width:100%;border-collapse:collapse;font-size:9pt'>" +
      window.TRIP.hotels.map(function (h) {
        return "<tr><td style='border:1px solid #999;padding:3pt'>" + T.fmtYmd(h.checkIn) + "–" + T.fmtYmd(h.checkOut) + "</td><td style='border:1px solid #999;padding:3pt'>" + h.name + "</td>" +
          "<td style='border:1px solid #999;padding:3pt'>" + (h.address || "") + (h.phone ? " · " + h.phone : "") + "</td><td style='border:1px solid #999;padding:3pt'>" + (h.confirmation || "") + "</td></tr>";
      }).join("") + "</table>" +
      "<h2 style='font-size:11pt;margin:8pt 0 3pt'>LINES THAT ANSWER</h2>" +
      "<p style='font-size:9pt;margin:2pt 0'>Qatar Airways +974 4023 0000 · American Airlines +1 800 433 7300 · LATAM +1 866 435 9526 · Marriott/Bonvoy +1 800 228 9290 · Fairfield Miami +1 786 456 2100</p>" +
      "<p style='font-size:9pt;margin:2pt 0'>US Embassy Lima +51 1 618 2000 (Av. La Encalada, Surco) · UK Embassy Lima +51 1 617 3000 (Miraflores) · verify numbers before travel</p>" +
      "<p style='font-size:9pt;margin:2pt 0'>Family: parents in Jacksonville (see phone) · Parents' airline ref LFSOJH · Emergency services: USA 911 · Peru 105 · Thailand 191</p>" +
      "<p style='font-size:8pt;color:#555;margin:6pt 0 0'>Fill in by hand: insurance policy no. ______________ · hotline ______________ · passport no. ______________ (never store these digitally here)</p>" +
    "</div>";
  }

  var rt = document.getElementById("reveal-toggle");
  if (rt) rt.addEventListener("click", function () {
    Store.setSetting("revealSensitive", !reveal);
    window.Views.documents(root);
  });
  var pe = document.getElementById("print-emergency");
  if (pe) pe.addEventListener("click", function () {
    document.body.classList.add("print-emc");
    var done = function () { document.body.classList.remove("print-emc"); window.removeEventListener("afterprint", done); };
    window.addEventListener("afterprint", done);
    window.print();
    setTimeout(done, 2000);
  });
};


/* ===== assets/js/ui/today.js ===== */
/* ============================================================
   TODAY.JS — “Where am I today?” + Travel-Day Focus Mode.
   Pre-trip: a daily briefing. During: the day's plan. After:
   the archive. Travel-day mode is a full-screen overlay.
   ============================================================ */
window.Views = window.Views || {};

window.Views.today = function (root, params) {
  "use strict";
  var I = U.icons;

  function render() {
    var w = Engine.whereAmI();
    var ph = w.phase;
    var nf = Engine.nextFlight();
    var rd = Engine.readiness();
    var acts = Engine.topActions(3);
    var isTravel = Engine.isTravelDayToday();

    var whereTitle, whereSub, sleepTonight = "Home, Bangkok";
    if (w.mode === "pre") {
      whereTitle = "Bangkok. Preparing.";
      whereSub = "Departure in " + Engine.phaseNow().daysToDep + " days · " + ph.name;
    } else if (w.day) {
      var place = Engine.placeOf(w.day.place);
      whereTitle = w.day.title;
      whereSub = T.fmtYmd(w.localDate, { weekday: "long", day: "numeric", month: "long" }) + " · " + (place ? place.name + " local reckoning" : "");
      sleepTonight = w.day.sleep || "—";
    } else {
      whereTitle = "The journey is complete.";
      whereSub = "Archive mode";
    }

    var tomorrow = (function () {
      if (!w.day) return null;
      var idx = window.TRIP.days.indexOf(w.day);
      return window.TRIP.days[idx + 1] || null;
    })();

    root.innerHTML =
      '<div class="view"><section class="section">' +

      '<div class="card today-hero">' +
        '<div class="q">where am I today?</div>' +
        "<h2>" + U.esc(whereTitle) + "</h2>" +
        '<div style="color:var(--faint)">' + U.esc(whereSub) + "</div>" +
        '<div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap">' +
          '<span class="pill gold">' + U.esc(ph.name) + "</span>" +
          (isTravel ? '<span class="pill danger">travel day</span>' : "") +
          '<span class="pill ' + (rd.onSchedule ? "ok" : "warn") + '">' + (rd.onSchedule ? "on schedule" : "attention needed") + "</span>" +
        "</div>" +
        (isTravel || w.mode !== "pre" ? '<p style="margin:16px 0 0"><button class="btn primary" id="tdm-open">' + I.planeUp + " Travel-day focus mode</button></p>" :
          '<p style="margin:16px 0 0"><button class="btn" id="tdm-open">' + I.planeUp + " Preview travel-day mode</button></p>") +
      "</div>" +

      '<div class="grid g2" style="margin-top:18px">' +

        '<div class="card pad"><div class="kicker dim">today answers</div><div class="big-list" style="margin-top:8px">' +
          '<div class="row"><div class="k">doing</div><div class="v">' + U.esc(w.mode === "pre" ? "Preparation: " + ph.name.toLowerCase() : (w.day ? w.day.sub : "Post-trip archive")) + "</div></div>" +
          '<div class="row"><div class="k">sleeping</div><div class="v">' + U.esc(w.mode === "pre" ? "Home, Bangkok" : sleepTonight) + "</div></div>" +
          '<div class="row"><div class="k">next move</div><div class="v">' + (nf ? U.esc(nf.flightNo + " · " + nf.from + " → " + nf.to + " · ") + T.fmtDT(T.parse(nf.dep), Engine.placeOf(nf.from).tz) : "No further flights") + "</div></div>" +
          (tomorrow ? '<div class="row"><div class="k">tomorrow</div><div class="v">' + U.esc(tomorrow.title) + "</div></div>" : "") +
          '<div class="row"><div class="k">overdue</div><div class="v">' + (rd.overdue ? rd.overdue + " task" + (rd.overdue > 1 ? "s" : "") + ", see Prepare" : "nothing") + "</div></div>" +
        "</div></div>" +

        '<div class="card pad"><div class="kicker dim">what matters today</div>' +
          (acts.length ? acts.map(function (t) {
            return '<div class="action-row">' + (t.priority === "critical" ? I.warn : I.check) +
              '<div><div class="t">' + U.esc(t.title) + '</div><div class="d">' + U.esc(t.detail.slice(0, 100)) + "…</div></div></div>";
          }).join("") : '<div class="empty">' + I.check + "<p>Clear. Anticipation is the only task.</p></div>") +
        "</div>" +
      "</div>" +

      (w.mode === "pre" ?
        '<div class="card pad" style="margin-top:18px"><div class="kicker dim">tonight’s briefing</div>' +
        '<p style="color:var(--paper-dim);max-width:70ch">' + U.esc(ph.message) + "</p>" +
        '<div class="coords">countdown runs on Bangkok time · full task calendar under Prepare</div></div>'
      : "") +

      "</section></div>";

    var btn = document.getElementById("tdm-open");
    if (btn) btn.addEventListener("click", openTDM);
    if (params && params.tdm) openTDM();
  }

  /* ---------------- travel-day overlay ---------------- */
  function openTDM() {
    var nf = Engine.nextFlight();
    var w = Engine.whereAmI();
    var overlay = document.createElement("div");
    overlay.className = "tdm";

    function hotelTonight() {
      if (!w.day) return null;
      var seg = (w.day.segments || []).filter(function (s) { return s.kind === "hotel" && s.ref; })[0];
      return seg ? Engine.hotelById(seg.ref) : null;
    }
    var ht = hotelTonight();

    var checklist = [
      "Passport in pocket, not in the bag",
      "Boarding pass loaded offline + printed backup",
      "Phone + power bank charged",
      "Prescriptions in the cabin bag",
      "Confirmation PDFs reachable offline",
      "Cash + cards split between bags"
    ];

    function leaveBy(f) {
      if (!f) return null;
      var dep = T.parse(f.dep);
      var intl = !(f.from === "MIA" && f.to === "JAX");
      var bufferMin = intl ? 180 : 120;
      var rideMin = f.from === "BKK" ? 60 : f.from === "LIM" ? 60 : 25;
      return new Date(dep.getTime() - (bufferMin + rideMin) * 60000);
    }
    var lv = leaveBy(nf);

    overlay.innerHTML =
      '<div class="tdm-in">' +
        '<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">' +
          '<span class="kicker">travel day focus</span>' +
          '<button class="btn small" id="tdm-close" style="margin-left:auto">Close ✕</button>' +
        "</div>" +
        '<div class="bigtime" id="tdm-clock">—</div>' +
        '<div style="color:var(--faint)" id="tdm-date"></div>' +

        (nf ?
          '<div class="bigcard">' +
            '<div class="biglabel">next flight</div>' +
            '<div class="fno">' + U.esc(nf.flightNo) + " · " + nf.from + " → " + nf.to + "</div>" +
            '<div class="biglabel" style="margin-top:14px">departs</div>' +
            '<div class="bigv">' + T.fmtDT(T.parse(nf.dep), Engine.placeOf(nf.from).tz) + " · " + U.esc(Engine.placeOf(nf.from).name) + " local</div>" +
            (lv ? '<div class="biglabel">leave for the airport by</div><div class="bigv" style="color:var(--gold)">' + T.fmtDT(lv, Engine.placeOf(nf.from).tz) + "</div>" : "") +
            '<div class="biglabel">seat · cabin · bags</div>' +
            '<div class="bigv">' + (nf.seat ? U.esc(nf.seat) : "seat at check-in") + " · " + U.esc(nf.cabin) + " · " + U.esc(nf.baggage ? nf.baggage.checked : "see ticket") + "</div>" +
            '<div class="biglabel">reference</div>' +
            '<div class="bigv masked">' + (Store.settings().revealSensitive ? U.esc(nf.bookingRef || "—") : U.mask(nf.bookingRef || "")) + "</div>" +
            '<div class="biglabel">terminal</div>' +
            '<div class="bigv" style="color:var(--paper-dim)">check the airport display on the day (not stated on the ticket)</div>' +
            '<div style="margin-top:10px"><span class="mono" style="color:var(--faint);font-size:.8rem">boards from ' + U.esc(Engine.placeOf(nf.from).airport || nf.from) + " · in <span id='tdm-in'>…</span></span></div>" +
          "</div>"
        : '<div class="bigcard"><div class="biglabel">no flights remain</div><div class="bigv">The journey is complete.</div></div>') +

        (ht ?
          '<div class="bigcard" style="border-color:var(--line-strong);background:var(--ink1)">' +
            '<div class="biglabel">tonight</div>' +
            '<div class="bigv">' + U.esc(ht.name) + "</div>" +
            (ht.address ? '<div style="color:var(--paper-dim)">' + U.esc(ht.address) + "</div>" : "") +
            (ht.phone ? '<div class="mono" style="margin-top:6px">' + U.esc(ht.phone) + "</div>" : "") +
            '<div class="biglabel" style="margin-top:10px">confirmation</div>' +
            '<div class="bigv masked">' + (Store.settings().revealSensitive ? U.esc(ht.confirmation || "—") : U.mask(ht.confirmation || "")) + "</div>" +
          "</div>" : "") +

        '<div style="margin:20px 0 60px">' +
          '<div class="biglabel" style="margin-bottom:6px">the six that cannot be forgotten</div>' +
          checklist.map(function (c, i) {
            var id = "tdmcl-" + i, done = Store.isChecked("packing", id);
            return '<div class="checkrow"><input type="checkbox" class="cb" id="' + id + '" data-pack="' + id + '"' + (done ? " checked" : "") + "><label for='" + id + "'" + (done ? ' style="text-decoration:line-through;color:var(--faint)"' : "") + ">" + U.esc(c) + "</label></div>";
          }).join("") +
          '<p style="color:var(--faint);font-size:.8rem;margin-top:14px">This screen works fully offline. Emergency card prints from the Documents tab.</p>' +
        "</div>" +
      "</div>";

    document.body.appendChild(overlay);
    document.body.style.overflow = "hidden";

    function close() {
      overlay.remove();
      document.body.style.overflow = "";
      if (params) delete params.tdm;
      App.offTick(tickTDM);
    }
    overlay.querySelector("#tdm-close").addEventListener("click", close);
    overlay.querySelectorAll("[data-pack]").forEach(function (cb) {
      cb.addEventListener("change", function () {
        Store.setChecked("packing", cb.getAttribute("data-pack"), cb.checked);
        var lb = overlay.querySelector("label[for='" + cb.id + "']");
        if (lb) lb.style.cssText = cb.checked ? "text-decoration:line-through;color:var(--faint)" : "";
      });
    });

    function tickTDM() {
      var tz = nf ? Engine.placeOf(nf.from).tz : w.tz;
      var ck = overlay.querySelector("#tdm-clock"), dt = overlay.querySelector("#tdm-date"), inEl = overlay.querySelector("#tdm-in");
      if (!ck) return;
      var n = T.now();
      ck.textContent = T.fmtTime(n, tz);
      dt.textContent = T.fmtFull(n, tz) + " · " + (nf ? Engine.placeOf(nf.from).name + " local time" : "local time");
      if (inEl && nf) {
        var c = T.countdownTo(nf.dep);
        inEl.textContent = c.past ? "departed" : c.days + " d " + U.pad2(c.hours) + " h " + U.pad2(c.mins) + " m";
      }
    }
    tickTDM();
    App.onTick(tickTDM);
  }

  render();
};


/* ===== assets/js/app.js ===== */
/* ============================================================
   APP.JS — shell: hash router, masthead, tabs, tick loop.
   ============================================================ */
window.App = (function () {
  "use strict";
  var I = U.icons;

  var TABS = [
    { id: "home",      label: "Command",   icon: I.compass },
    { id: "itinerary", label: "Itinerary", icon: I.list },
    { id: "map",       label: "Atlas",     icon: I.globe },
    { id: "journey",   label: "Journey",   icon: I.mountain },
    { id: "flights",   label: "Flights",   icon: I.plane },
    { id: "prepare",   label: "Prepare",   icon: I.check },
    { id: "documents", label: "Documents", icon: I.doc },
    { id: "today",     label: "Today",     icon: I.sun }
  ];
  var MOBILE_TABS = ["home", "itinerary", "prepare", "today", "map"];

  var tickHandlers = [];
  function onTick(fn) { if (tickHandlers.indexOf(fn) < 0) tickHandlers.push(fn); }
  function offTick(fn) { var i = tickHandlers.indexOf(fn); if (i >= 0) tickHandlers.splice(i, 1); }

  function toast(msg) {
    var t = U.el('<div class="toast">' + U.esc(msg) + "</div>");
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2600);
  }

  function parseHash() {
    var h = location.hash.replace(/^#\/?/, "") || "home";
    var parts = h.split("?");
    var params = {};
    if (parts[1]) parts[1].split("&").forEach(function (kv) {
      var p = kv.split("="); params[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || "1");
    });
    return { view: parts[0], params: params };
  }

  function readinessWarn() {
    var rd = Engine.readiness();
    return rd.overdueCritical > 0 || rd.overdue > 2;
  }

  function renderChrome() {
    var ph = Engine.phaseNow();
    var route = parseHash();
    var head = document.getElementById("chrome");
    head.innerHTML =
      '<header class="masthead"><div class="masthead-in">' +
        '<div class="brand"><span class="t">PERU<em> + </em>USA <em>2026</em></span><span class="route">THE SUNLIT ATLAS · BKK · DOH · MIA · JAX · LIM · CUZ</span></div>' +
        '<div class="mast-clocks">' +
          '<div class="mast-clock"><div class="z">Bangkok</div><div class="v" data-mclock="Asia/Bangkok">—</div></div>' +
          '<div class="mast-clock"><div class="z">Florida</div><div class="v" data-mclock="America/New_York">—</div></div>' +
          '<div class="mast-clock"><div class="z">Lima</div><div class="v" data-mclock="America/Lima">—</div></div>' +
        "</div>" +
        '<span class="phase-chip">' + U.esc(ph.phase.name) + "</span>" +
      "</div></header>" +
      '<nav class="tabs" aria-label="Sections">' + TABS.map(function (t) {
        return '<a href="#/' + t.id + '"' + (route.view === t.id ? ' class="active"' : "") + ">" + t.icon + U.esc(t.label) +
          (t.id === "prepare" && readinessWarn() ? '<span class="warn-dot" title="overdue tasks"></span>' : "") + "</a>";
      }).join("") + "</nav>";

    var bn = document.getElementById("bottomnav");
    bn.innerHTML = MOBILE_TABS.map(function (id) {
      var t = TABS.filter(function (x) { return x.id === id; })[0];
      return '<a href="#/' + t.id + '"' + (route.view === t.id ? ' class="active"' : "") + ">" + t.icon + "<span>" + U.esc(t.label) + "</span></a>";
    }).join("");
  }

  function renderView() {
    var route = parseHash();
    var main = document.getElementById("main");
    tickHandlers.length = 0; // views re-register on render
    var fn = window.Views[route.view] || window.Views.home;
    try {
      fn(main, route.params);
    } catch (err) {
      main.innerHTML = '<div class="view"><div class="card pad empty">' + U.icons.warn +
        "<p>This view hit an error: " + U.esc(err.message) + "</p>" +
        '<p><a class="btn" href="#/home">Back to the command center</a></p></div></div>';
      if (window.console) console.error(err);
    }
    window.scrollTo({ top: 0 });
  }

  function tickMastClocks() {
    var n = T.now();
    document.querySelectorAll("[data-mclock]").forEach(function (el) {
      el.textContent = T.fmtTime(n, el.getAttribute("data-mclock"));
    });
  }

  function boot() {
    renderChrome();
    renderView();
    tickMastClocks();

    window.addEventListener("hashchange", function () { renderChrome(); renderView(); });

    setInterval(function () {
      tickMastClocks();
      tickHandlers.slice().forEach(function (fn) { try { fn(); } catch (e) { offTick(fn); } });
    }, 1000);

    // Gentle nudge: travel-day suggestion once per travel day
    try {
      if (Engine.isTravelDayToday()) {
        var key = "tdm-nudge-" + T.todayYmd("Asia/Bangkok");
        if (!Store.get(key, false)) { Store.set(key, true); toast("Travel day. The Today tab has a focus mode."); }
      }
    } catch (e) { /* non-fatal */ }
  }

  if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", boot); } else { boot(); }

  return { onTick: onTick, offTick: offTick, toast: toast };
})();

</script>
